name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        # Trusted Publishing (OIDC): no token here on purpose. npm authenticates
        # the run from the id-token permission above; setting NODE_AUTH_TOKEN
        # would switch npm back to token auth and break the publish.
        run: npm publish --access public --provenance
